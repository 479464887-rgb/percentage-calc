<!DOCTYPE html>
<html lang="en">

<head>
<meta property="og:title" content="Percentage Calc — DevKit">
<meta property="og:description" content="Free online Percentage Calc tool — fast, simple, and no signup required.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://479464887-rgb.github.io/percentage-calc/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://479464887-rgb.github.io/percentage-calc/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠</text></svg>">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Percentage Calc — DevKit Tools</title>
  <meta name="description" content="在线百分比计算器 - 百分比/百分比变化/百分比差值等">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column
    }

    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #58a6ff
    }

    .logo span {
      color: #f0c040
    }

    header .badge {
      font-size: 10px;
      background: #daa520;
      color: #fff;
      padding: 2px 8px;
      border-radius: 10px;
      margin-left: 8px
    }

    main {
      max-width: 700px;
      margin: 0 auto;
      padding: 32px 24px;
      flex: 1
    }

    .tool-wrapper {
      padding: 20px 0
    }

    footer {
      padding: 16px 24px;
      border-top: 1px solid #21262d;
      text-align: center;
      font-size: 12px;
      color: #484f58
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
      margin: 0 8px
    }

    .btn-primary:hover {
      background: #2ea043 !important
    }

    .btn:hover {
      background: #30363d !important
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #58a6ff !important
    }

    .btn {
      font-family: inherit
    }
/* 响应式设计 */
@media (max-width: 768px) {
  body { padding: 12px; }
  header { padding: 12px 16px; flex-direction: column; }
  .container { max-width: 100%; padding: 0 8px; }
  h1 { font-size: 1.5rem; }
  textarea, input, select, button { width: 100%; }
  .grid { grid-template-columns: 1fr; }
  .card { padding: 12px; }
}  </style>
</head>

<body>
  <header>
    <div class="logo">🛠 <span>Dev</span>Kit<span class="badge">BETA</span></div>
    <div style="font-size:11px;color:#8b949e">🔒 Processed locally · 数据不Upload</div>
  </header>
  <main>
    <h1 style="font-size:24px;margin-bottom:4px">Percentage Calculator</h1>
    <p style="color:#8b949e;font-size:14px;margin-bottom:8px">在线百分比计算器 - 百分比/百分比变化/百分比差值等</p>
    <div class="tool-wrapper">
      <div style="display:flex;gap:4px;margin-bottom:12px"><button class="tab-btn active" onclick="switchPC('percent')" id="tab-percent" style="flex:1;padding:10px;border:1px solid #58a6ff;border-radius:6px 6px 0 0;background:#1a2230;color:#58a6ff;cursor:pointer;font-size:13px;font-weight:600">百分比计算</button><button class="tab-btn" onclick="switchPC('change')" id="tab-change" style="flex:1;padding:10px;border:1px solid #30363d;border-radius:6px 6px 0 0;background:#161b22;color:#8b949e;cursor:pointer;font-size:13px;font-weight:600">变化率</button><button class="tab-btn" onclick="switchPC('difference')" id="tab-difference" style="flex:1;padding:10px;border:1px solid #30363d;border-radius:6px 6px 0 0;background:#161b22;color:#8b949e;cursor:pointer;font-size:13px;font-weight:600">差值%</button></div>
      <div id="pc-percent" style="background:#161b22;border:1px solid #30363d;border-radius:0 0 8px 8px;padding:20px">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="font-size:14px">数字的</span><input type="number" id="pc-pct" value="10" style="width:80px;padding:8px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:14px;outline:none;text-align:center"><span style="font-size:14px">% = </span><input type="number" id="pc-val" value="200" style="width:120px;padding:8px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:14px;outline:none;text-align:center"></div>
        <div id="pc-result1" style="margin-top:16px;font-size:20px;font-weight:700;color:#3fb950;text-align:center">10% of 200 = 20</div>
      </div>
      <div id="pc-change" style="background:#161b22;border:1px solid #30363d;border-radius:0 0 8px 8px;padding:20px;display:none">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="font-size:14px">从</span><input type="number" id="pc-from" value="100" style="width:100px;padding:8px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:14px;outline:none;text-align:center"><span style="font-size:14px">到</span><input type="number" id="pc-to" value="150" style="width:100px;padding:8px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:14px;outline:none;text-align:center"></div>
        <div id="pc-result2" style="margin-top:16px;font-size:20px;font-weight:700;text-align:center">变化: <span style="color:#3fb950">+50 (50% ↑)</span></div>
      </div>
      <div id="pc-difference" style="background:#161b22;border:1px solid #30363d;border-radius:0 0 8px 8px;padding:20px;display:none">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="font-size:14px">A:</span><input type="number" id="pc-a" value="80" style="width:100px;padding:8px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:14px;outline:none;text-align:center"><span style="font-size:14px">B:</span><input type="number" id="pc-b" value="100" style="width:100px;padding:8px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:14px;outline:none;text-align:center"></div>
        <div id="pc-result3" style="margin-top:16px;font-size:20px;font-weight:700;color:#58a6ff;text-align:center">A 是 B 的 80%</div>
      </div>
    </div>
  </main>
  <footer><a href="https://github.com/479464887-rgb/percentage-calc">GitHub</a><span>·</span><span>© 2026 DevKit</span></footer>
  <script>
    function switchPC(m) {
      ['percent', 'change', 'difference'].forEach(x => {
        document.getElementById('pc-' + x).style.display = x === m ? 'block' : 'none';
        const t = document.getElementById('tab-' + x);
        t.style.borderColor = x === m ? '#58a6ff' : '#30363d';
        t.style.background = x === m ? '#1a2230' : '#161b22';
        t.style.color = x === m ? '#58a6ff' : '#8b949e'
      })
    }

    function calc1() {
      const p = parseFloat(document.getElementById('pc-pct').value) || 0;
      const v = parseFloat(document.getElementById('pc-val').value) || 0;
      document.getElementById('pc-result1').textContent = `${p}% of ${v} = ${(v*p/100).toFixed(4)}`
    }

    function calc2() {
      const f = parseFloat(document.getElementById('pc-from').value) || 0;
      const t = parseFloat(document.getElementById('pc-to').value) || 0;
      if (f === 0) {
        document.getElementById('pc-result2').innerHTML = '变化: <span style=color:#f85149>初始值不能为0</span>';
        return
      }
      const d = t - f;
      const p = ((d / f) * 100).toFixed(2);
      const sign = d >= 0 ? '+' : '';
      const color = d >= 0 ? '#3fb950' : '#f85149';
      const arrow = d >= 0 ? '↑' : '↓';
      document.getElementById('pc-result2').innerHTML = `变化: <span style=color:${color}>${sign}${d} (${sign}${p}% ${arrow})</span>`
    }

    function calc3() {
      const a = parseFloat(document.getElementById('pc-a').value) || 0;
      const b = parseFloat(document.getElementById('pc-b').value) || 0;
      if (b === 0) {
        document.getElementById('pc-result3').textContent = 'B 不能为0';
        return
      }
      const p = ((a / b) * 100).toFixed(2);
      document.getElementById('pc-result3').textContent = `A 是 B 的 ${p}%`
    } ['pc-pct', 'pc-val'].forEach(id => document.getElementById(id).addEventListener('input', calc1));
    ['pc-from', 'pc-to'].forEach(id => document.getElementById(id).addEventListener('input', calc2));
    ['pc-a', 'pc-b'].forEach(id => document.getElementById(id).addEventListener('input', calc3));
    calc1();
    calc2();
    calc3()
  </script>
</body>

</html>
